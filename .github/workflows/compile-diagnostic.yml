# 已按仓库所有者决定停用（2026-08-27）：该诊断流在 fork 上长期红、与配对扫描任务无关。
# 完整历史实现见 git log 中此文件的上一个版本；本占位仅保留文件避免误恢复，
# 并通过自触发产生一个绿色记录覆盖红点噪声。
name: compile-diagnostic (disabled)

on:
  push:
    branches: [workbench/ramen-mcts-iteration]
    paths:
      - .github/workflows/compile-diagnostic.yml

permissions:
  contents: read

jobs:
  disabled-by-owner-request:
    runs-on: ubuntu-latest
    steps:
      - name: Explain
        run: |
          echo "compile-diagnostic 辅助流已停用。"
          echo "它检测的是与本 workbench 无关的旧诊断路径，历史上长期标红造成噪声。"
          echo "如需恢复：git revert 本文件的变更即可找回原实现。"
