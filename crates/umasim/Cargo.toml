[package]
name = "umasim"
version = "0.2.3"
edition = "2024"

[[bin]]
name = "umasim"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "ramen_manual"
path = "src/bin/ramen_manual.rs"
required-features = ["cli", "diag"]

[[bin]]
name = "ramen_player"
path = "src/bin/ramen_player.rs"
required-features = ["experiment-tools"]

[[bin]]
name = "ramen_feature_dataset"
path = "tools/data_collection/ramen_feature_dataset.rs"

[[bin]]
name = "ramen_low_score_diagnostic"
path = "tools/data_collection/ramen_low_score_diagnostic.rs"

[[bin]]
name = "skill_pt_matrix"
path = "tools/data_collection/skill_pt_matrix.rs"

[[bin]]
name = "skill_pt_phase_matrix"
path = "tools/data_collection/skill_pt_phase_matrix.rs"

[[bin]]
name = "y3_train_pt_trace"
path = "tools/data_collection/y3_train_pt_trace.rs"

[[bin]]
name = "composition_weight_matrix"
path = "tools/data_collection/composition_weight_matrix.rs"

# 以下工具由专项脚本临时注入候选参数入口，不属于常规发布构建目标。
[[bin]]
name = "exact_weight_confirm"
path = "tools/data_collection/exact_weight_confirm.rs"
required-features = ["experiment-tools"]

[[bin]]
name = "wisdom_structure_diagnostic"
path = "tools/data_collection/wisdom_structure_diagnostic.rs"
required-features = ["experiment-tools"]

[[bin]]
name = "y3_local_matrix"
path = "tools/data_collection/y3_local_matrix.rs"
required-features = ["experiment-tools"]

[[bin]]
name = "y3_narrow_matrix"
path = "tools/data_collection/y3_narrow_matrix.rs"
required-features = ["experiment-tools"]

[[bin]]
name = "vital_transition_matrix"
path = "tools/data_collection/vital_transition_matrix.rs"
required-features = ["experiment-tools"]

[[bin]]
name = "vital_transition_diagnostic"
path = "tools/data_collection/vital_transition_diagnostic.rs"
required-features = ["experiment-tools"]

[[bin]]
name = "recipe_continuity_matrix"
path = "tools/data_collection/recipe_continuity_matrix.rs"
required-features = ["experiment-tools"]

[[bin]]
name = "y3_eat_first_vital_matrix"
path = "tools/data_collection/y3_eat_first_vital_matrix.rs"
required-features = ["experiment-tools"]

[[bin]]
name = "region_gauge_diagnostic"
path = "tools/data_collection/region_gauge_diagnostic.rs"
required-features = ["experiment-tools"]

[[bin]]
name = "region_matrix"
path = "tools/data_collection/region_matrix.rs"
required-features = ["experiment-tools"]

[[bin]]
name = "trainer_overhead_diagnostic"
path = "tools/data_collection/trainer_overhead.rs"

[[bin]]
name = "mcts_rollout_switch_verify"
path = "tools/data_collection/mcts_rollout_switch_verify.rs"

[[bin]]
name = "sim_profiler"
path = "tools/data_collection/sim_profiler.rs"

[[bin]]
name = "mine_pair_matrix"
path = "tools/data_collection/mine_pair_matrix.rs"
required-features = ["experiment-tools"]

[[bin]]
name = "hw_vs_mcts_compare"
path = "tools/data_collection/hw_vs_mcts_compare.rs"
required-features = ["experiment-tools"]

[features]
default = ["cli", "diag"]
diag = []
# 仅用于显式启用需要实验脚本配套处理的数据采集工具。
experiment-tools = []
cli = [
    "dep:inquire",
    "dep:comfy-table",
    "dep:flexi_logger",
    "dep:env_logger",
    "dep:indicatif",
    "dep:text-to-ascii-art",
    "dep:clap",
    "dep:tokio",
]
no-color = ["colored/no-color"]
onnx = ["dep:tract-onnx"]

[dependencies]
anyhow.workspace = true
bincode.workspace = true
chrono.workspace = true
enum-iterator.workspace = true
fs-err.workspace = true
hashbrown.workspace = true
log.workspace = true
rand.workspace = true
rand_distr.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
int-enum = "1.2.0"
parse-display = "0.11.0"
colored.workspace = true
csv.workspace = true
lexopt.workspace = true

inquire = { workspace = true, optional = true }
comfy-table = { workspace = true, optional = true }
flexi_logger = { workspace = true, optional = true }
env_logger = { workspace = true, optional = true }
indicatif = { workspace = true, optional = true }
text-to-ascii-art = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

tract-onnx = { workspace = true, optional = true }
indexmap.workspace = true
pprof = { workspace = true, features = ["protobuf-codec"] }
